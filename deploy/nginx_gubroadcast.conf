# Droplet: static site straight from disk. Certbot: certbot --nginx -d YOURDOMAIN
server {
    listen 80;
    listen [::]:80;
    server_name YOURDOMAIN www.YOURDOMAIN;
    return 301 https://$server_name$request_uri;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOURDOMAIN www.YOURDOMAIN;
    ssl_certificate     /etc/letsencrypt/live/YOURDOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOURDOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    root /var/www/gubroadcast;
    index index.html;

    location = /rundown.json { deny all; }          # internal hand-off to the studio
    location /social/ { deny all; }                  # vertical cuts for manual posting
    location /v/ { expires 7d; add_header Cache-Control "public"; mp4; }
    location /story/ { expires 10m; }
    error_page 404 /404.html;
    location = /search-index.json { expires 5m; }
    location /assets/ { expires 7d; add_header Cache-Control "public"; }
    location ~ \.xml$ { expires 5m; }
    location / { try_files $uri $uri/ =404; expires 2m; }
}
