# gubs.ca: static site straight from disk. Certs: deploy/provision_droplet.sh (certbot webroot, auto-renew).
server {
    listen 80;
    listen [::]:80;
    server_name gubs.ca www.gubs.ca;
    location /.well-known/acme-challenge/ { root /var/www/gubroadcast; }
    location / { return 301 https://gubs.ca$request_uri; }
}
server {                                   # www -> apex
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.gubs.ca;
    ssl_certificate     /etc/letsencrypt/live/gubs.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gubs.ca/privkey.pem;
    return 301 https://gubs.ca$request_uri;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gubs.ca;
    ssl_certificate     /etc/letsencrypt/live/gubs.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gubs.ca/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:gubsSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    include /etc/nginx/snippets/gubs-security-headers.conf;
    autoindex off;

    root /var/www/gubroadcast;
    index index.html;

    location = /rundown.json { deny all; }          # internal hand-off to the studio
    location ~ /\. { deny all; }                    # dotfiles (.env, .git) never served
    location ~ \.(db|sqlite|jsonl|py|sh|env)$ { deny all; }
    location /social/ { deny all; }                  # vertical cuts for manual posting
    location /v/ { expires 7d; add_header Cache-Control "public"; include /etc/nginx/snippets/gubs-security-headers.conf; mp4; }
    location /story/ { expires 10m; }
    error_page 404 /404.html;
    location = /search-index.json { expires 5m; }
    location /assets/ { expires 7d; add_header Cache-Control "public"; include /etc/nginx/snippets/gubs-security-headers.conf; }
    location ~ \.xml$ { expires 5m; }
    location /img/ { expires 7d; add_header Cache-Control "public"; include /etc/nginx/snippets/gubs-security-headers.conf; }
    # sign-in + membership service (gbs/account/server.py, gubroadcast-account.service)
    location /auth/ {
        limit_req zone=gubs_auth burst=20 nodelay;
        proxy_pass http://127.0.0.1:8710;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
    location = /billing/webhook {
        limit_req zone=gubs_hook burst=50 nodelay;
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:8710;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /api/ {
        limit_req zone=gubs_auth burst=5 nodelay;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:8710;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /billing/ {
        limit_req zone=gubs_auth burst=20 nodelay;
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:8710;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
    location /account/ { try_files $uri $uri/ =404; add_header Cache-Control "no-store"; include /etc/nginx/snippets/gubs-security-headers.conf; }
    location / { try_files $uri $uri/ =404; expires 2m; }
}
