# Included in every gubs.ca location that sets its own headers (nginx drops server-level
# add_header in any location that has add_header of its own). Installed by deploy/update.sh
# to /etc/nginx/snippets/gubs-security-headers.conf.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# CSP: no inline script except the pinned member flag (gbs/site/assets.py MEMBER_JS). If AdSense is
# switched on (GBS_ADSENSE_CLIENT), add https://pagead2.googlesyndication.com and friends here first.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-gffH7Qc2yldP8OWioH91wPUqxFaEG8dl/OY/A8YSqmQ='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self'; connect-src 'self'; frame-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self' https://*.kit.com https://checkout.stripe.com https://billing.stripe.com; upgrade-insecure-requests" always;
