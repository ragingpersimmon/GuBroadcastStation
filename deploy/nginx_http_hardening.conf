# http-context settings for gubs.ca. Installed by deploy/update.sh to /etc/nginx/conf.d/gubs-hardening.conf.
server_tokens off;                                   # no nginx version in headers or error pages
limit_req_zone $binary_remote_addr zone=gubs_auth:10m rate=10r/m;    # sign-in, checkout, inquiries
limit_req_zone $binary_remote_addr zone=gubs_hook:10m rate=10r/s;    # Stripe webhooks
limit_req_status 429;
client_body_timeout 15s;
client_header_timeout 15s;
