name: Deploy to droplet

# Runs deploy/update.sh on the droplet after every push to main, or on demand
# (Actions -> Deploy to droplet -> Run workflow).
# Repo secrets: DROPLET_HOST (IP or hostname), DROPLET_USER (sudo user),
# DROPLET_SSH_KEY (private key whose public half is in that user's authorized_keys).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check secrets
        env:
          HOST: ${{ secrets.DROPLET_HOST }}
          KEY: ${{ secrets.DROPLET_SSH_KEY }}
        run: |
          if [ -z "$HOST" ] || [ -z "$KEY" ]; then
            echo "::error::Add DROPLET_HOST, DROPLET_USER and DROPLET_SSH_KEY in Settings -> Secrets and variables -> Actions"
            exit 1
          fi
      - name: Run update.sh over SSH
        env:
          HOST: ${{ secrets.DROPLET_HOST }}
          USER: ${{ secrets.DROPLET_USER }}
          KEY: ${{ secrets.DROPLET_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -T 15 "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "${USER:-root}@$HOST" '
            set -e
            cd /opt/gubroadcast
            echo "before: $(git log -1 --format="%h %ad %s" --date=short)"
            sudo bash deploy/update.sh
            echo "after:  $(git log -1 --format="%h %ad %s" --date=short)"
          '
      - name: Smoke check
        run: |
          sleep 20
          curl -fsS -o /dev/null -w "gubs.ca %{http_code}\n" https://gubs.ca/
